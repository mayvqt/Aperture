services:
  aperture:
    build:
      context: .
      dockerfile: Dockerfile
    image: aperture:local
    container_name: aperture
    restart: unless-stopped

    ports:
      - "8099:8099"

    volumes:
      - /mnt/cache/appdata/aperture:/config

    environment:
      APERTURE_HTTP_ADDR: "${APERTURE_HTTP_ADDR:-:8099}"
      APERTURE_CONFIG_DIR: "/config"
      APERTURE_DB_PATH: "/config/aperture.db"

      APERTURE_PUBLIC_URL: "${APERTURE_PUBLIC_URL:-}"
      APERTURE_LOG_LEVEL: "${APERTURE_LOG_LEVEL:-info}"

      APERTURE_COOKIE_SECURE: "${APERTURE_COOKIE_SECURE:-}"
      APERTURE_TRUSTED_PROXY_CIDRS: "${APERTURE_TRUSTED_PROXY_CIDRS:-127.0.0.1/32}"

      APERTURE_ENCRYPTION_KEY: "${APERTURE_ENCRYPTION_KEY:-}"
      APERTURE_SESSION_SECRET: "${APERTURE_SESSION_SECRET:-}"
      APERTURE_INVITE_SECRET: "${APERTURE_INVITE_SECRET:-}"

      APERTURE_MEDIA_PROVIDER: "${APERTURE_MEDIA_PROVIDER:-}"
      APERTURE_SERVER_URL: "${APERTURE_SERVER_URL:-}"
      APERTURE_API_KEY: "${APERTURE_API_KEY:-}"
